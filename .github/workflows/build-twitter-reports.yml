name: Build Twitter reports

on:
  # schedule: # Disabled: Cloudflare Worker handles scheduling
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Copilot model to use for report generation.
        required: false
        type: choice
        default: gpt-6-luna
        options:
          - gpt-6-luna
          - gpt-6-sol
          - gpt-5.6-terra
          - grok-4.7
          - claude-opus-4.6
          - claude-sonnet-4.6
          - gpt-5.4
          - gpt-5.5

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-twitter-reports:
    name: Build Twitter reports
    uses: ./.github/workflows/build-source-reports-reusable.yml
    with:
      source_key: twitter
      source_label: Twitter
      model: ${{ inputs.model || 'gpt-6-luna' }}
    secrets:
      HARVESTER_PAT: ${{ secrets.HARVESTER_PAT }}
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
      WEBSITE_PAT: ${{ secrets.WEBSITE_PAT }}
