name: Translate reports to Chinese

on:
  # schedule: # Disabled: Cloudflare Worker handles scheduling
  #   - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Copilot SDK model to use for translation and review.
        required: false
        type: choice
        default: gemini-3.8-flash
        options:
          - gemini-3.8-flash
          - gpt-5.6-luna
          - gpt-5.4-mini
          - gpt-5.4

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  HARVESTER_REPO: vibewatch/harvester

jobs:
  translate:
    name: Translate to Chinese
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - name: Checkout harvester
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HARVESTER_REPO }}
          token: ${{ secrets.HARVESTER_PAT }}
          path: harvester

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install translation dependencies
        working-directory: website
        run: npm ci

      - name: Select model effort
        id: copilot-model
        env:
          COPILOT_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
        run: |
          case "$COPILOT_MODEL" in
            gemini-3.8-flash)
              COPILOT_EFFORT=default
              ;;
            gpt-5.6-luna)
              COPILOT_EFFORT=none
              ;;
            gpt-5.4-mini|gpt-5.4)
              COPILOT_EFFORT=low
              ;;
            *)
              echo "::error::Unsupported Copilot model: $COPILOT_MODEL"
              exit 1
              ;;
          esac
          echo "model=$COPILOT_MODEL" >> "$GITHUB_OUTPUT"
          echo "effort=$COPILOT_EFFORT" >> "$GITHUB_OUTPUT"

      - name: Translate reports
        working-directory: website
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          node scripts/translate-markdown.mjs \
            --root ../harvester/reports \
            --model "${{ steps.copilot-model.outputs.model }}" \
            --effort "${{ steps.copilot-model.outputs.effort }}" \
            --fallback-model gpt-5.4 \
            --fallback-effort low \
            --concurrency 2

      - name: Detect new translations
        id: check-translations
        working-directory: harvester
        run: |
          UNSTAGED=$(git status --porcelain reports/ | grep '\.zh\.md$' || true)
          if [ -n "$UNSTAGED" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push translations to harvester
        if: steps.check-translations.outputs.has_changes == 'true'
        working-directory: harvester
        run: |
          push_with_rebase_retry() {
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                return 0
              fi
              echo "Push failed on attempt ${attempt}; retrying after rebasing latest origin/main..."
            done
            echo "Unable to push after 5 attempts."
            return 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'reports/**/*.zh.md'
          if git diff --cached --quiet; then
            echo "No staged translations to commit; changes may already be committed."
          else
            git commit -m "Add Chinese translations for $(date -u +%Y-%m-%d)"
          fi
          push_with_rebase_retry

      - name: Copy translations to website
        if: steps.check-translations.outputs.has_changes == 'true'
        run: |
          rsync -av --include='*/' --include='*.zh.md' --exclude='*' harvester/reports/ website/docs/

      - name: Push docs to website
        if: steps.check-translations.outputs.has_changes == 'true'
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No new translations to push"
          else
            git commit -m "Add Chinese translations for $(date -u +%Y-%m-%d)"
            push_with_rebase_retry() {
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then
                  return 0
                fi
                echo "Push failed on attempt ${attempt}; retrying after rebasing latest origin/main..."
              done
              echo "Unable to push after 5 attempts."
              return 1
            }

            push_with_rebase_retry
          fi
